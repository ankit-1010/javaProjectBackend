spring.application.name=moneymate-backend
server.port=${PORT:8080}

# CORS Configuration from Environment (reads CORS_ALLOWED_ORIGINS, defaults to http://localhost:5173 for local dev)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==================================================
# Aiven MySQL Datasource Configuration
# Supports DB_URL directly, or DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ==================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:mysql-34d178ef-ankitsrivastava0037-ecb1.e.aivencloud.com}:${DB_PORT:17929}/${DB_NAME:defaultdb}?sslMode=REQUIRED&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Script Init (Schema handled by Hibernate ddl-auto and DataInitializer)
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=${JWT_SECRET:moneymateSecretKeyForJwtSigningMustBeAtLeast256BitsLongSecureKey123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Initializer Configuration (from Environment)
admin.email=${ADMIN_EMAIL:admin@gmail.com}
admin.password=${ADMIN_PASSWORD:admin123}
admin.name=${ADMIN_NAME:Admin}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.moneymate=INFO
